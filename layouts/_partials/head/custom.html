{{ $custom := resources.Get "css/custom.css" | resources.Minify }}
<link rel="stylesheet" href="{{ $custom.RelPermalink }}">
<link rel="icon" href="/favicon.ico">
{{ with resources.Get "img/background.png" }}
<style>
  :root {
    --legacy-background-image: url('{{ .RelPermalink }}');
  }
</style>
<script>
  (function () {
    const backgroundKey = "StackLegacyBackground";
    let backgroundValue = localStorage.getItem(backgroundKey);

    if (!backgroundValue) {
      backgroundValue = "on";
      localStorage.setItem(backgroundKey, backgroundValue);
    }

    document.documentElement.classList.toggle("legacy-background-enabled", backgroundValue === "on");
  })();
</script>
{{ end }}

{{ with .Site.Params.verification.google }}
<meta name="google-site-verification" content="{{ . }}">
{{ end }}

{{ with .Site.Params.firebase }}
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "{{ .apiKey }}",
    authDomain: "{{ .authDomain }}",
    projectId: "{{ .projectId }}",
    storageBucket: "{{ .storageBucket }}",
    messagingSenderId: "{{ .messagingSenderId }}",
    appId: "{{ .appId }}",
    measurementId: "{{ .measurementId }}"
  };

  if (typeof firebase !== "undefined" && !firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
    window.db = firebase.firestore();
    window.auth = firebase.auth();
  }
</script>
{{ end }}

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const subtitle = document.querySelector(".site-description");
    if (!subtitle) return;

    subtitle.textContent = "쓰러지면 어때 일어나면 그만인걸";
  });
</script>
